<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050608"><title>Re:NQX 統合確認版</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8ebf1;background:#050608}*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;background:#050608}button{font:inherit;color:inherit;background:transparent;border:0}.screen{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));position:relative;overflow:hidden;background:radial-gradient(circle at 50% 41%,rgba(94,116,146,.10),transparent 34%),linear-gradient(rgba(20,25,33,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(20,25,33,.12) 1px,transparent 1px),#050608;background-size:auto,64px 64px,64px 64px,auto}.home{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto 42px;gap:0}.summary{min-height:42px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:end;padding:0 2px 9px;border-bottom:1px solid #20252d;color:#9aa3af;font-size:8px;letter-spacing:.08em;white-space:nowrap}.summary span:nth-of-type(2){text-align:center;color:#c9cfd7}.summary span:last-child{text-align:right}.summary i{font-style:normal;color:#313842;padding:0 4px}.pair{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #20252d}.pair button{min-height:32px;border-right:1px solid #20252d;color:#9099a4;font-size:8px;letter-spacing:.18em}.pair button:last-child{border-right:0}.stage{display:grid;place-items:center;min-height:0;overflow:hidden}.pixel-creature{width:min(68vw,280px);height:min(68vw,280px);image-rendering:pixelated;filter:drop-shadow(0 0 18px rgba(219,235,255,.12))}.explore{width:100%;min-height:42px;margin-top:6px;border-top:1px solid #29303a;border-bottom:1px solid #29303a;color:#c0c7d0;font-size:9px;letter-spacing:.2em}.ad{height:42px;margin-top:8px;border:1px dashed #242a33;display:flex;align-items:center;justify-content:center;gap:8px;color:#4f5864;font-size:8px}.ad b{font-weight:500;border:1px solid #343b45;padding:2px 4px}.detail{overflow:auto}.back{min-height:42px;display:grid;grid-template-columns:62px 1fr 62px;align-items:center;border-bottom:1px solid #20252d}.back button{justify-self:start;color:#808a95;font-size:8px;letter-spacing:.14em}.back strong{grid-column:2;text-align:center;font-size:10px;letter-spacing:.18em}.visual{display:grid;grid-template-columns:138px 1fr;align-items:center;min-height:160px;border-bottom:1px solid #20252d}.visual .pixel-creature{width:128px;height:128px}.visual div:last-child{display:flex;flex-direction:column;gap:5px}.visual b{font-size:15px}.visual span{font-size:8px;color:#737c87}.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #20252d;border-left:1px solid #20252d;margin-top:12px}.grid div{padding:10px 8px;border-right:1px solid #20252d;border-bottom:1px solid #20252d}.grid .wide{grid-column:1/-1}.grid small{display:block;color:#69727e;font-size:7px;letter-spacing:.12em}.grid b{display:block;margin-top:4px;font-size:10px}.bank{text-align:center;padding:26px 0 18px;border-bottom:1px solid #20252d}.bank small{display:block;color:#727b86;font-size:8px}.bank strong{display:block;font-size:36px;font-weight:500}.rows button{width:100%;min-height:44px;display:grid;grid-template-columns:1fr 50px 38px;align-items:center;border-bottom:1px solid #20252d;text-align:left;font-size:9px}.rows button.selected{background:rgba(210,225,245,.06);box-shadow:inset 2px 0 #cfd7e2}.rows b,.rows em{text-align:right}.rows em{font-style:normal;color:#7b8490}.growth-selection{min-height:36px;padding:10px 4px;color:#87919d;font-size:8px;text-align:center}.confirm{width:100%;min-height:44px;border:1px solid #39434f;color:#dce2e8;letter-spacing:.16em;font-size:9px}.confirm:disabled{opacity:.25}.log article{padding:10px 0;border-bottom:1px solid #191e25}.log time,.log p{font-size:8px;color:#737c87}.log b{display:block;font-size:9px;margin-top:3px}.pvp{display:grid;place-items:center;padding:24px 0}.pvp .pixel-creature{width:180px;height:180px}.pvp-actions{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#252c35;border:1px solid #252c35}.pvp-actions button{min-height:44px;background:#07090c;font-size:9px}.help{text-align:center;color:#707985;font-size:8px;line-height:1.6}.interstice-screen{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;min-height:100dvh;overflow:hidden;padding:0 0 max(.45rem,env(safe-area-inset-bottom));background:#050505}.interstice-screen.zero-mode{background:#f4f4f4;color:#171717}.interstice-hud{--hud-safe-top:env(safe-area-inset-top);--scope-axis-y:calc(var(--hud-safe-top) + 3.72rem);position:relative;z-index:3;width:100%;min-height:calc(clamp(7.15rem,16.5dvh,8.4rem) + var(--hud-safe-top));pointer-events:none;letter-spacing:.12em;font-variant-numeric:tabular-nums}.core-signal-label{position:absolute;top:calc(var(--hud-safe-top) + .15rem);left:50%;transform:translateX(-50%);font-size:.57rem;opacity:.76}.phase-count{position:absolute;top:var(--scope-axis-y);left:50%;transform:translate(-50%,-50%);font-size:clamp(1.45rem,6.5vw,1.9rem);line-height:1}.scope-hint{position:absolute;min-width:1.7rem;text-align:center;font-size:clamp(.66rem,2.8vw,.78rem);line-height:1;opacity:.88}.hint-up{top:calc(var(--hud-safe-top) + 1.2rem);left:50%;transform:translateX(-50%)}.hint-left{top:var(--scope-axis-y);left:max(5mm,env(safe-area-inset-left));transform:translateY(-50%)}.hint-right{top:var(--scope-axis-y);right:max(5mm,env(safe-area-inset-right));transform:translateY(-50%)}.hint-down{bottom:.28rem;left:50%;transform:translateX(-50%)}.reticle-line{position:absolute;left:50%;width:1px;transform:translateX(-50%);background:currentColor;opacity:.28}.reticle-line-top{top:calc(var(--hud-safe-top) + 2.2rem);height:.78rem}.reticle-line-bottom{top:calc(var(--hud-safe-top) + 5.25rem);bottom:1.42rem}.interstice-canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none}.interstice-notice{position:relative;z-index:3;min-height:2.1rem;margin:0;text-align:center;font-size:.8rem}.extra{position:absolute;z-index:7;top:max(.45rem,env(safe-area-inset-top));left:max(.5rem,env(safe-area-inset-left));right:max(.5rem,env(safe-area-inset-right));display:flex;justify-content:space-between;pointer-events:none}.extra span,.extra button{pointer-events:auto;color:rgba(244,244,244,.62);font-size:7px;letter-spacing:.12em}.notice{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:8px;color:#5e6874;z-index:20}@media(max-width:360px){.screen{padding-left:12px;padding-right:12px}.summary{font-size:7px}.pixel-creature{width:min(62vw,230px);height:min(62vw,230px)}}</style></head><body><div id="app"></div><div class="notice">Re:NQX 統合確認版 / GitHub Pages</div><script type="module">import {drawReferenceAberrant} from './aberrantVisual.js';import {createIntersticeRun,intersticeMarkup,drawInterstice,updateIntersticeHud,attemptMove} from './interstice.js';const app=document.getElementById('app');const aberrant={id:'AB-2719',type:'NQX',class:184,stage:2,generation:1,sync:37,syncLimit:100,fragments:18,seed:'RENQX-PREVIEW-NQX',abilities:{LIFE:108,POWER:96,GUARD:88,SPEED:103,ABSORB:72,ADAPT:110},visualParams:{body:1,head:1,core:1,appendage:2,shell:1,aura:1,asymmetry:.12,scale:1,aspect:1,pattern:1,offset:0},color:{main:'#F4F1ED',sub:'#D9D9D6',core:'#FFFFFF'}};let pendingGrowth='';let animStop=()=>{};let run=null;const labels={LIFE:'生命',POWER:'攻撃',GUARD:'防御',SPEED:'速度',ABSORB:'吸収',ADAPT:'適応'};const back=t=>`<header class="back"><button data-view="home">戻る</button><strong>${t}</strong></header>`;function stopAnim(){animStop();animStop=()=>{}}function canvasHtml(cls='pixel-creature'){return `<canvas class="${cls}" width="72" height="72" data-creature></canvas>`}function drawPixel(c,frame=0){if(!c)return;const ratio=Math.min(devicePixelRatio||1,2),logical=72;c.width=logical*ratio;c.height=logical*ratio;c.style.imageRendering='pixelated';const ctx=c.getContext('2d');ctx.setTransform((logical/260)*ratio,0,0,(logical/260)*ratio,0,0);ctx.clearRect(0,0,260,260);ctx.imageSmoothingEnabled=false;const bob=Math.round(Math.sin(frame/2.7)*3),pulse=1+(Math.round(Math.sin(frame/4)*2)/100);ctx.save();ctx.translate(130,130+bob);ctx.scale(pulse,pulse);ctx.translate(-130,-130);drawReferenceAberrant(ctx,aberrant);ctx.restore()}function startAnim(){stopAnim();let f=0;const cs=[...document.querySelectorAll('[data-creature]')];cs.forEach(c=>drawPixel(c,f));const id=setInterval(()=>{f++;cs.forEach(c=>drawPixel(c,f))},120);animStop=()=>clearInterval(id)}function home(){stopAnim();app.innerHTML=`<main class="screen home"><header class="summary"><span>同期率 ${aberrant.sync}%</span><i>|</i><span>クラス ${String(aberrant.class).padStart(3,'0')}</span><i>|</i><span>フラグメント ${aberrant.fragments}</span></header><nav class="pair"><button data-view="status">状態</button><button data-view="history">履歴</button></nav><section class="stage">${canvasHtml()}</section><nav class="pair"><button data-view="growth">育成</button><button data-view="pvp">対戦</button></nav><button class="explore" data-view="explore">探索</button><aside class="ad"><b>AD</b><span>広告プロバイダ接続領域</span></aside></main>`;startAnim()}function status(){stopAnim();app.innerHTML=`<main class="screen detail">${back('状態')}<section class="visual">${canvasHtml()}<div><b>NQX</b><span>AB-2719</span></div></section><section class="grid">${[['タイプ','NQX'],['クラス',String(aberrant.class).padStart(3,'0')],['成長段階','中間成長'],['世代','1'],['生命',aberrant.abilities.LIFE],['攻撃',aberrant.abilities.POWER],['防御',aberrant.abilities.GUARD],['速度',aberrant.abilities.SPEED],['吸収',aberrant.abilities.ABSORB],['適応',aberrant.abilities.ADAPT],['同期',aberrant.sync+'%'],['同期限界','100%'],['フラグメント',aberrant.fragments],['クラス上限表示','666']].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}<div class="wide"><small>成長傾向</small><b>適応型 / 総成長 80</b></div><div class="wide"><small>外見変化</small><b>STAGE 2 / ADAPT系統変化</b></div></section></main>`;startAnim()}function history(){stopAnim();app.innerHTML=`<main class="screen detail">${back('履歴')}<section class="grid">${[['探索回数','12'],['最大階層','17'],['CORE到達','5'],['探索失敗','2'],['探索戦闘','8'],['対人戦','4'],['対人 勝/敗','3/1'],['連勝 / 最高','2/3'],['FRAGMENT獲得','34'],['FRAGMENT消費','16']].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</section><section class="log"><article><time>2026-10-12</time><b>PHASE CORE到達</b><p>階層17 / FRAGMENT +5 / 同期延長</p></article><article><time>2026-10-12</time><b>探索戦闘勝利</b><p>探索戦闘は現行Re:NQX仕様</p></article></section></main>`}function growth(){stopAnim();app.innerHTML=`<main class="screen detail">${back('育成')}<section class="bank"><small>フラグメント</small><strong>${aberrant.fragments}</strong><small>成長段階 中間成長 / 次 150</small></section><section class="rows">${Object.entries(labels).map(([k,v])=>`<button data-grow="${k}" class="${pendingGrowth===k?'selected':''}"><span>${v}</span><b>${aberrant.abilities[k]}</b><em>${pendingGrowth===k?'選択':'+1'}</em></button>`).join('')}</section><p class="growth-selection">${pendingGrowth?`${labels[pendingGrowth]}へフラグメント1を割り振ります`:'能力を1つ選択してください'}</p><button class="confirm" data-confirm-growth ${pendingGrowth&&aberrant.fragments>0?'':'disabled'}>割り振り確定</button><p class="help">確定するまでフラグメントは消費されません。</p></main>`}function confirmGrowth(){if(!pendingGrowth||aberrant.fragments<=0)return;aberrant.fragments-=1;aberrant.abilities[pendingGrowth]+=1;pendingGrowth='';growth()}function pvp(){stopAnim();app.innerHTML=`<main class="screen detail">${back('対戦')}<section class="pvp">${canvasHtml()}<p>NQX / クラス ${String(aberrant.class).padStart(3,'0')}</p></section><div class="pvp-actions"><button>対戦QRを表示</button><button>相手QRを読む</button></div><p class="help">対人戦は3ターン完全自動。探索中の戦闘とは別仕様です。</p></main>`;startAnim()}function explore(){stopAnim();run=createIntersticeRun(aberrant,{seed:'RENQX-CANON-PREVIEW',sizeName:'STANDARD',zeroMode:false});run.floor=17;app.innerHTML=intersticeMarkup(run);app.querySelector('.interstice-screen')?.insertAdjacentHTML('afterbegin','<div class="extra"><span>階層 017</span><button data-view="home">探索を中断</button></div>');paint()}function paint(){if(!run)return;updateIntersticeHud(app,run);drawInterstice(document.getElementById('interstice-canvas'),run)}let pointer=null;app.addEventListener('click',e=>{const grow=e.target.closest('[data-grow]');if(grow){pendingGrowth=grow.dataset.grow;growth();return}if(e.target.closest('[data-confirm-growth]')){confirmGrowth();return}const view=e.target.closest('[data-view]')?.dataset.view;if(!view)return;({home,status,history,growth,pvp,explore}[view]||home)()});app.addEventListener('pointerdown',e=>{if(e.target.id==='interstice-canvas')pointer={x:e.clientX,y:e.clientY,id:e.pointerId}});app.addEventListener('pointerup',e=>{if(!pointer||e.target.id!=='interstice-canvas')return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.max(Math.abs(dx),Math.abs(dy))<26)return;const move=Math.abs(dx)>Math.abs(dy)?[dx>0?1:-1,0]:[0,dy>0?1:-1];const r=attemptMove(run,move[0],move[1],aberrant);if(r.moved)paint()});home();</script></body></html>
