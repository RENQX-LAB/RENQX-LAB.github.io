<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050608"><title>Re:NQX 統合確認版</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8ebf1;background:#050608}*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;background:#050608}button{font:inherit;color:inherit;background:transparent;border:0}.screen{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));position:relative;overflow:hidden;background:radial-gradient(circle at 50% 41%,rgba(94,116,146,.10),transparent 34%),linear-gradient(rgba(20,25,33,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(20,25,33,.12) 1px,transparent 1px),#050608;background-size:auto,64px 64px,64px 64px,auto}.home{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto 42px;gap:0}.summary{min-height:42px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:end;padding:0 2px 9px;border-bottom:1px solid #20252d;color:#9aa3af;font-size:8px;letter-spacing:.08em;white-space:nowrap}.summary span:nth-of-type(2){text-align:center;color:#c9cfd7}.summary span:last-child{text-align:right}.summary i{font-style:normal;color:#313842;padding:0 4px}.pair{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #20252d}.pair button{min-height:32px;border-right:1px solid #20252d;color:#9099a4;font-size:8px;letter-spacing:.18em}.pair button:last-child{border-right:0}.stage{display:grid;place-items:center;min-height:0;overflow:hidden}.creature{width:min(62vw,260px);aspect-ratio:1;position:relative;filter:drop-shadow(0 0 20px rgba(219,235,255,.12));animation:idle 3.6s ease-in-out infinite}.core{position:absolute;left:50%;top:48%;width:92px;height:112px;transform:translate(-50%,-50%);background:#f3f1ea;clip-path:polygon(50% 0,88% 25%,78% 66%,50% 100%,22% 66%,12% 25%);border:1px solid #bce9ff}.core:before{content:"";position:absolute;left:50%;top:47%;width:48px;height:48px;border-radius:50%;transform:translate(-50%,-50%);background:#63dcf2;box-shadow:0 0 24px rgba(91,226,255,.55),inset 0 0 0 2px rgba(255,255,255,.9)}.core:after{content:"";position:absolute;left:50%;top:47%;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%);background:#fff}.halo,.ground{position:absolute;left:50%;transform:translateX(-50%);border:1px solid #e4d597;border-radius:50%}.halo{top:19%;width:110px;height:24px;box-shadow:0 0 10px rgba(255,224,130,.15)}.halo:after{content:"";position:absolute;inset:6px 14px;border:1px solid #ddd;border-radius:50%}.ground{bottom:16%;width:150px;height:16px;border-color:#6f8d9b}.shard{position:absolute;width:13px;height:35px;background:linear-gradient(#fff,#a6eaff);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.s1{left:12%;top:30%}.s2{right:12%;top:30%}.s3{left:9%;top:51%}.s4{right:9%;top:51%}.tail{position:absolute;top:59%;width:48px;height:74px;background:linear-gradient(180deg,#e7edf1,#9fb7c5);clip-path:polygon(50% 0,100% 28%,74% 100%,54% 73%,36% 100%,0 31%)}.tl{left:27%;transform:rotate(12deg)}.tr{right:27%;transform:scaleX(-1) rotate(12deg)}.explore{width:100%;min-height:42px;margin-top:6px;border-top:1px solid #29303a;border-bottom:1px solid #29303a;color:#c0c7d0;font-size:9px;letter-spacing:.2em}.ad{height:42px;margin-top:8px;border:1px dashed #242a33;display:flex;align-items:center;justify-content:center;gap:8px;color:#4f5864;font-size:8px}.ad b{font-weight:500;border:1px solid #343b45;padding:2px 4px}.detail{overflow:auto}.back{min-height:42px;display:grid;grid-template-columns:62px 1fr 62px;align-items:center;border-bottom:1px solid #20252d}.back button{justify-self:start;color:#808a95;font-size:8px;letter-spacing:.14em}.back strong{grid-column:2;text-align:center;font-size:10px;letter-spacing:.18em}.visual{display:grid;grid-template-columns:138px 1fr;align-items:center;min-height:160px;border-bottom:1px solid #20252d}.mini{transform:scale(.58);transform-origin:left center;width:240px;height:240px}.visual div:last-child{display:flex;flex-direction:column;gap:5px}.visual b{font-size:15px}.visual span{font-size:8px;color:#737c87}.grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #20252d;border-left:1px solid #20252d;margin-top:12px}.grid div{padding:10px 8px;border-right:1px solid #20252d;border-bottom:1px solid #20252d}.grid .wide{grid-column:1/-1}.grid small{display:block;color:#69727e;font-size:7px;letter-spacing:.12em}.grid b{display:block;margin-top:4px;font-size:10px}.bank{text-align:center;padding:26px 0 18px;border-bottom:1px solid #20252d}.bank small{display:block;color:#727b86;font-size:8px}.bank strong{display:block;font-size:36px;font-weight:500}.rows button{width:100%;min-height:44px;display:grid;grid-template-columns:1fr 50px 38px;align-items:center;border-bottom:1px solid #20252d;text-align:left;font-size:9px}.rows b,.rows em{text-align:right}.rows em{font-style:normal;color:#7b8490}.log article{padding:10px 0;border-bottom:1px solid #191e25}.log time,.log p{font-size:8px;color:#737c87}.log b{display:block;font-size:9px;margin-top:3px}.pvp{display:grid;place-items:center;padding:24px 0}.pvp .creature{width:180px}.pvp-actions{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#252c35;border:1px solid #252c35}.pvp-actions button{min-height:44px;background:#07090c;font-size:9px}.help{text-align:center;color:#707985;font-size:8px;line-height:1.6}.interstice{padding:0;background:#050505}.extra{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between}.extra span,.extra button{font-size:7px;color:#808995;letter-spacing:.13em}.core-signal{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.18em}.count{position:absolute;top:67px;left:50%;transform:translateX(-50%);font-size:27px;font-weight:700}.maze{position:absolute;inset:120px 0 32px}.maze svg{width:100%;height:100%}.notice{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font-size:8px;color:#5e6874}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media(max-width:360px){.screen{padding-left:12px;padding-right:12px}.summary{font-size:7px}.creature{width:min(58vw,220px)}}</style></head><body><div id="app"></div><div class="notice">Re:NQX 統合確認版 / GitHub Pages</div><script>const app=document.getElementById('app');const creature=()=>'<div class="creature"><div class="halo"></div><div class="shard s1"></div><div class="shard s2"></div><div class="shard s3"></div><div class="shard s4"></div><div class="core"></div><div class="tail tl"></div><div class="tail tr"></div><div class="ground"></div></div>';const back=t=>'<header class="back"><button onclick="home()">戻る</button><strong>'+t+'</strong></header>';function home(){app.innerHTML='<main class="screen home"><header class="summary"><span>同期率 37%</span><i>|</i><span>クラス 184</span><i>|</i><span>フラグメント 18</span></header><nav class="pair"><button onclick="status()">状態</button><button onclick="history()">履歴</button></nav><section class="stage">'+creature()+'</section><nav class="pair"><button onclick="growth()">育成</button><button onclick="pvp()">対戦</button></nav><button class="explore" onclick="explore()">探索</button><aside class="ad"><b>AD</b><span>広告プロバイダ接続領域</span></aside></main>'}function status(){app.innerHTML='<main class="screen detail">'+back('状態')+'<section class="visual"><div class="mini">'+creature()+'</div><div><b>NQX</b><span>AB-2719</span></div></section><section class="grid">'+[['タイプ','NQX'],['クラス','184'],['成長段階','中間成長'],['世代','1'],['生命','108'],['攻撃','96'],['防御','88'],['速度','103'],['吸収','72'],['適応','110'],['同期','37%'],['同期限界','100%'],['フラグメント','18'],['クラス上限表示','666']].map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'<div class="wide"><small>成長傾向</small><b>適応型 / 総成長 80</b></div><div class="wide"><small>外見変化</small><b>STAGE 2 / ADAPT系統変化</b></div></section></main>'}function history(){app.innerHTML='<main class="screen detail">'+back('履歴')+'<section class="grid">'+[['探索回数','12'],['最大階層','17'],['CORE到達','5'],['探索失敗','2'],['探索戦闘','8'],['対人戦','4'],['対人 勝/敗','3/1'],['連勝 / 最高','2/3'],['FRAGMENT獲得','34'],['FRAGMENT消費','16']].map(x=>'<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</section><section class="log"><article><time>2026-10-12</time><b>PHASE CORE到達</b><p>階層17 / FRAGMENT +5 / 同期延長</p></article><article><time>2026-10-12</time><b>探索戦闘勝利</b><p>探索戦闘は現行Re:NQX仕様</p></article></section></main>'}function growth(){app.innerHTML='<main class="screen detail">'+back('育成')+'<section class="bank"><small>フラグメント</small><strong>18</strong><small>成長段階 中間成長 / 次 150</small></section><section class="rows">'+[['生命',108],['攻撃',96],['防御',88],['速度',103],['吸収',72],['適応',110]].map(x=>'<button><span>'+x[0]+'</span><b>'+x[1]+'</b><em>+1</em></button>').join('')+'</section></main>'}function pvp(){app.innerHTML='<main class="screen detail">'+back('対戦')+'<section class="pvp">'+creature()+'<p>NQX / クラス 184</p></section><div class="pvp-actions"><button>対戦QRを表示</button><button>相手QRを読む</button></div><p class="help">対人戦は3ターン完全自動。探索中の戦闘とは別仕様です。</p></main>'}function explore(){app.innerHTML='<main class="screen interstice"><div class="extra"><span>階層 017</span><button onclick="home()">探索を中断</button></div><div class="core-signal">CORE SIGNAL</div><div class="count">286</div><div class="maze"><svg viewBox="0 0 390 650" preserveAspectRatio="none"><g fill="none" stroke="#d8dde2" stroke-width=".8" opacity=".78"><path d="M195 325H245V275H295V225H345M195 325V375H145V425H95V475H45M195 325H145V275H95V225H45M195 325V275H195V225H245V175H295V125M245 375H295V425H345V475M145 375H95V325H45M295 275V325H345M95 275V325M195 375V425H245V475H295V525H345M145 425V475H195V525H245V575M45 175H95V125H145V75H195M345 175H295V75H245V25"/></g><circle cx="195" cy="325" r="3.2" fill="#fff"/><circle cx="295" cy
