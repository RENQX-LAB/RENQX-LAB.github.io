name: STEP 7A-4 Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step7a4-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download validated release artifact
        run: |
          curl -L --fail --retry 2 'https://sdmntprseasia.oaiusercontent.com/files/00000000-b758-8207-ba84-0df9c2e7012f/raw?se=2026-10-10T08%3A50%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=c63640cc-d8e9-5a84-a94e-759c55917cd7&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T03%3A40%3A05Z&ske=2026-10-11T03%3A40%3A05Z&sks=b&skv=2026-02-06&sig=Cav3BC0Y%2BdhOqUnDh1K4%2BNv8wTrpPnKRKfq8uHLFVvo%3D' -o /tmp/renqx-release.zip
          echo '174249ff82b4563173be8ee24756ca77201091798c69e0a02a9265ee0bf75012  /tmp/renqx-release.zip' | sha256sum -c -
      - name: Install exact release under re-NQX
        run: |
          rm -rf /tmp/renqx-release
          mkdir -p /tmp/renqx-release
          unzip -q /tmp/renqx-release.zip -d /tmp/renqx-release
          rm -rf re-NQX
          mkdir -p re-NQX
          cp -a /tmp/renqx-release/. re-NQX/
          test -f re-NQX/index.html
          test -f re-NQX/manifest.webmanifest
          test -f re-NQX/sw.js
      - name: Publish release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A re-NQX
          git diff --cached --quiet && exit 0
          git commit -m "Publish STEP 7A-4 release"
          git push origin HEAD:main
