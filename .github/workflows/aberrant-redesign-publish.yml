name: ABERRANT Visual Redesign Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aberrant-redesign-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download validated release artifact
        run: |
          curl -L --fail --retry 2 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-a7c4-8208-b63e-7e6aa130e48e/raw?se=2026-10-10T12%3A57%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=b0989ce8-0d0f-5777-b0ed-6ad43fcae3be&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T23%3A43%3A55Z&ske=2026-10-10T23%3A43%3A55Z&sks=b&skv=2026-02-06&sig=iRpvoiHO/mmE3FiEddbceVRzxtqnIuq97%2Bpy7yPDUn4%3D' -o /tmp/renqx-aberrant-redesign.zip
          echo '33490489a49102519898f353cd9669e2a35d3b40d94c921aa63119faaa81695e  /tmp/renqx-aberrant-redesign.zip' | sha256sum -c -
      - name: Install exact release under re-NQX
        run: |
          rm -rf /tmp/renqx-aberrant-redesign
          mkdir -p /tmp/renqx-aberrant-redesign
          unzip -q /tmp/renqx-aberrant-redesign.zip -d /tmp/renqx-aberrant-redesign
          rm -rf re-NQX
          mkdir -p re-NQX
          cp -a /tmp/renqx-aberrant-redesign/. re-NQX/
          test -f re-NQX/index.html
          test -f re-NQX/manifest.webmanifest
          test -f re-NQX/sw.js
      - name: Publish release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A re-NQX
          git diff --cached --quiet && exit 0
          git commit -m "Publish ABERRANT visual redesign"
          git push origin HEAD:main
