name: Publish Re:NQX STEP 7A-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-final.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v4
      - name: Download and verify STEP 7A-2 artifact
        run: |
          curl --fail --location --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-c87c-8206-990b-97b172b206f8/raw?se=2026-10-10T07%3A22%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=f75af641-c19b-5235-8a59-f09e8ccd3343&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T23%3A25%3A31Z&ske=2026-10-10T23%3A25%3A31Z&sks=b&skv=2026-02-06&sig=IOPy2Vj8CLJmMDxuuWJ1zQqq9uXzzj5ERjAJw7PgWcA%3D' --output /tmp/re-nqx-step7a2-dist.zip
          echo 'e4cdeb2834ede64ea66e69233db367067cba07e3ce9523b51b19c66d3eba7043  /tmp/re-nqx-step7a2-dist.zip' | sha256sum -c -
      - name: Install exact release
        run: |
          rm -rf re-NQX
          mkdir -p re-NQX
          unzip -q /tmp/re-nqx-step7a2-dist.zip -d re-NQX
          cat > index.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/re-NQX/"><title>Re:NQX</title></head><body><a href="/re-NQX/">Re:NQX</a></body></html>
          EOF
          touch .nojekyll
      - name: Commit public release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Re:NQX STEP 7A-2 release f373bed1121cdc302973e41bf7d7a95dcaa4caf8'
          git push
