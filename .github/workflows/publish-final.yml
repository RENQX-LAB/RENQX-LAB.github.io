name: Publish frozen Re:NQX release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-final.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v4
      - name: Download and verify frozen artifact
        run: |
          curl --fail --location --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-d188-8206-acbb-28365ef9b66f/raw?se=2026-10-10T05%3A40%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=a5f5f264-02fa-58e8-a37b-654a3a8bf37b&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T23%3A43%3A34Z&ske=2026-10-10T23%3A43%3A34Z&sks=b&skv=2026-02-06&sig=e5QpaWCImQF32AaVc/Pz8KDZtiXZq1DDnNpT9RdpEYU%3D' --output /tmp/re-nqx-final-dist.zip
          echo '83f49bc6f26d667de04b862e000612168a87c7cee568a0bc8b3dba620365be10  /tmp/re-nqx-final-dist.zip' | sha256sum -c -
      - name: Install exact frozen release
        run: |
          rm -rf re-NQX
          mkdir -p re-NQX
          unzip -q /tmp/re-nqx-final-dist.zip -d re-NQX
          rm -rf .release
          rm -rf assets
          rm -f manifest.webmanifest registerSW.js sw.js icon.svg
          cat > index.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/re-NQX/"><title>Re:NQX</title></head><body><a href="/re-NQX/">Re:NQX</a></body></html>
          EOF
          touch .nojekyll
      - name: Commit public release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish frozen Re:NQX release e3e1bb4cd2a690aec4931e89e7fda343d93b6bd5'
          git push
