name: Publish frozen Re:NQX release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-final.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mirror
        uses: actions/checkout@v4
      - name: Download and verify frozen artifact
        run: |
          curl --fail --location --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-27d0-8209-840b-c149ef75789c/raw?se=2026-10-10T06%3A41%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=6ed02b84-c703-5497-9efa-1e6fab34df0e&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T00%3A31%3A37Z&ske=2026-10-11T00%3A31%3A37Z&sks=b&skv=2026-02-06&sig=CKaoAR9RYpyghx91WDL6rjohbWnV5bOPNMyz97eU1mE%3D' --output /tmp/re-nqx-final-dist.zip
          echo 'ab7c94a231168de01b4cea897c2adddc1b3a218c7a4a0dc010cfaf2c33aeb914  /tmp/re-nqx-final-dist.zip' | sha256sum -c -
      - name: Install exact frozen release
        run: |
          rm -rf re-NQX
          mkdir -p re-NQX
          unzip -q /tmp/re-nqx-final-dist.zip -d re-NQX
          rm -rf .release
          rm -rf assets
          rm -f manifest.webmanifest registerSW.js sw.js icon.svg
          cat > index.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=/re-NQX/"><title>Re:NQX</title></head><body><a href="/re-NQX/">Re:NQX</a></body></html>
          EOF
          touch .nojekyll
      - name: Commit public release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Re:NQX STEP 7A release 0cf8b333b88eeac5f3c60f3d2cc2c66ca8f1021d'
          git push
